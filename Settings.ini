[Paths]
# Folder where you drop audio files.
# Easiest way to change this: double-click 2 Choose Folders.command.
watch_folder = Audio to Transcribe

# Folder where finished transcripts are saved.
# Easiest way to change this: double-click 2 Choose Folders.command.
transcript_folder = Finished Transcripts

# Where downloaded AI models are stored.
# Most people should leave this alone.
model_cache_dir = models

# Sound to play when a transcript finishes.
# Leave blank to turn off the sound.
notification_sound = assets/notify.wav

[Whisper]
# Transcription model.
# Recommended: medium
# This is the model Nathan has been using. It is a good starter balance of
# accuracy and speed on Apple Silicon Macs.
# Smaller/faster: tiny, base, small
# Bigger/slower: large-v1, large-v2, large-v3, large-v3-turbo
model_size = medium

# Audio language.
# Recommended for English interviews: en
# Use auto only if you need automatic language detection. Auto is slower.
language = en

# Computer processor setting.
# Recommended on Macs: cpu
# Leave this alone unless a technical person tells you to change it.
device = cpu

# Speed/accuracy memory setting for CPU transcription.
# Recommended on Macs: int8
# Leave this alone unless a technical person tells you to change it.
compute_type = int8

# How many chunks the model handles at once.
# Recommended: 8
# Lower this to 4 only if the Mac runs out of memory.
batch_size = 8

[Diarization]
# Speaker labels are required.
# Paste the Hugging Face token into this separate file:
# My Hugging Face Token.txt
#
# Do NOT paste the token into Settings.ini.
# Do NOT email or post My Hugging Face Token.txt.
token_file = My Hugging Face Token.txt

[Transcription]
# Add a timecode after this many sentences from the same speaker.
# Recommended: 5
sentences_per_timecode = 5

# What kind of transcript file to save.
#   txt  = readable transcript with speaker names and timecodes (default)
#   srt  = subtitle file with start/end times for each line (for video/captions)
#   both = save a .txt AND a .srt
output_format = txt

# Process files that were already in the audio folder before 3 Start Transcriber.command opened?
# Recommended: no
# Leave as no unless you intentionally want to process a folder full of old files.
process_existing_on_start = no

# Safety limit if process_existing_on_start is changed to yes.
# If too many old files are found, the app will refuse to auto-queue them.
max_existing_files_on_start = 25

# Watch subfolders inside the audio folder?
# Recommended: no
# Leave as no for the simplest workflow.
recursive_watch = no

# Skip an audio file if a transcript with the same name already exists?
# Recommended: yes
# Change to no only if you want to overwrite/recreate transcripts.
skip_if_transcript_exists = yes
